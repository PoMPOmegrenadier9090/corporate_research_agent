services:
  mcp-tools:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: agent-mcp-tools
    container_name: mcp-tools
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9001
      - MCP_PATH=/mcp
    command: uv run -m mcp_server.main
    volumes:
      - ./mcp:/app
    ports:
      - "9001:9001"
    restart: unless-stopped